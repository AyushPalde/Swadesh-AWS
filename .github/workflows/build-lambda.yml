
name: Build SWADESH Lambda

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/build-lambda.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Package Lambda
        working-directory: backend
        run: npm run package

      - name: Upload Lambda ZIP
        uses: actions/upload-artifact@v4
        with:
          name: swadesh-lambda-deployment
          path: backend/dist/function.zip
          if-no-files-found: error
          retention-days: 7
